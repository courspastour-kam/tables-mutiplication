<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables de Multiplication</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #a8edea, #fed6e3, #f9f7f7);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
        }

        .container {
            text-align: center;
            padding: 40px;
            background: rgba(255, 255, 255, 0.75);
            border-radius: 24px;
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 8px 32px rgba(168, 200, 255, 0.3);
            max-width: 500px;
            width: 90%;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 8px;
            color: #ff6b9d;
            text-shadow: 0 2px 8px rgba(255, 107, 157, 0.3);
        }

        .subtitle {
            font-size: 0.95rem;
            color: #999;
            margin-bottom: 30px;
        }

        /* --- PHRASE GÉNÉRÉE --- */
        .phrase-box {
            background: rgba(255, 182, 214, 0.2);
            border: 2px solid #ff6b9d;
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 25px;
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .phrase-box.vide {
            border-color: #ccc;
            background: rgba(200, 200, 200, 0.1);
        }

        #phraseText {
            font-size: 1.2rem;
            font-weight: 600;
            color: #e05588;
        }

        .phrase-box.vide #phraseText {
            color: #bbb;
            font-weight: 400;
            font-style: italic;
        }

        /* --- BOUTONS --- */
        .boutons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        button {
            padding: 14px 28px;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        #btnGenerer {
            background: linear-gradient(135deg, #ff6b9d, #ff9a9e);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 107, 157, 0.4);
        }

        #btnGenerer:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 107, 157, 0.5);
        }

        #btnGenerer:active {
            transform: translateY(0);
        }

        #btnAfficher {
            background: linear-gradient(135deg, #84fab0, #8fd3f4);
            color: #2a7a5a;
            box-shadow: 0 4px 15px rgba(132, 250, 176, 0.4);
        }

        #btnAfficher:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(132, 250, 176, 0.5);
        }

        #btnAfficher:active:not(:disabled) {
            transform: translateY(0);
        }

        #btnAfficher:disabled {
            background: linear-gradient(135deg, #ddd, #eee);
            color: #aaa;
            box-shadow: none;
            cursor: not-allowed;
        }

        /* --- TABLE --- */
        .table-box {
            display: none;
            background: rgba(143, 211, 244, 0.15);
            border: 2px solid #8fd3f4;
            border-radius: 14px;
            padding: 20px;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        #tabletitre {
            font-size: 1.3rem;
            font-weight: 700;
            color: #4a90d9;
            margin-bottom: 15px;
        }

        #tableListe {
            list-style: none;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        #tableListe li {
            background: rgba(255, 255, 255, 0.7);
            border-radius: 10px;
            padding: 8px 12px;
            font-size: 1rem;
            color: #555;
            border: 1px solid rgba(143, 211, 244, 0.4);
            transition: background 0.2s;
        }

        #tableListe li:hover {
            background: rgba(255, 255, 255, 1);
        }

        #tableListe li span {
            font-weight: 700;
            color: #ff6b9d;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🔢 Tables de Multiplication</h1>
    <p class="subtitle">Génère une table aléatoire et entraîne-toi !</p>

    <!-- Phrase générée -->
    <div class="phrase-box vide" id="phraseBox">
        <p id="phraseText">Clique sur "Générer" pour commencer...</p>
    </div>

    <!-- Boutons -->
    <div class="boutons">
        <button id="btnGenerer" onclick="genererTable()">🎲 Générer</button>
        <button id="btnAfficher" onclick="afficherTable()" disabled>📋 Afficher la table</button>
    </div>

    <!-- Table affichée -->
    <div class="table-box" id="tableBox">
        <p id="tabletitre"></p>
        <ul id="tableListe"></ul>
    </div>
</div>

<script>
    let nombreActuel = null;

    function genererTable() {
        nombreActuel = Math.floor(Math.random() * 13);

        const phraseBox  = document.getElementById('phraseBox');
        const phraseText = document.getElementById('phraseText');

        phraseText.textContent = `Récite la table de multiplication de ${nombreActuel}`;
        phraseBox.classList.remove('vide');

        document.getElementById('btnAfficher').disabled = false;

        const tableBox = document.getElementById('tableBox');
        tableBox.style.display = 'none';
    }

    function afficherTable() {
        if (nombreActuel === null) return;

        const tableBox   = document.getElementById('tableBox');
        const tabletitre = document.getElementById('tabletitre');
        const tableListe = document.getElementById('tableListe');

        tabletitre.textContent = `Table de ${nombreActuel}`;
        tableListe.innerHTML   = '';

        for (let i = 0; i <= 12; i++) {
            const resultat = nombreActuel * i;
            const li       = document.createElement('li');
            li.innerHTML   = `${nombreActuel} × ${i} = <span>${resultat}</span>`;
            tableListe.appendChild(li);
        }

        tableBox.style.display = 'block';
    }
</script>

</body>
</html>
