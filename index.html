<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables de Multiplication</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .container {
            text-align: center;
            padding: 40px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 90%;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            color: #e94560;
            text-shadow: 0 0 20px rgba(233, 69, 96, 0.5);
        }

        .subtitle {
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 30px;
        }

        /* --- PHRASE GÉNÉRÉE --- */
        .phrase-box {
            background: rgba(233, 69, 96, 0.15);
            border: 2px solid #e94560;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .phrase-box p {
            font-size: 1.3rem;
            font-weight: bold;
            color: #fff;
            letter-spacing: 0.5px;
        }

        .phrase-box.vide p {
            color: rgba(255, 255, 255, 0.3);
            font-style: italic;
            font-weight: normal;
            font-size: 1rem;
        }

        /* --- BOUTONS --- */
        .boutons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        button {
            padding: 14px 28px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            letter-spacing: 0.5px;
        }

        button:active {
            transform: scale(0.95);
        }

        #btnGenerer {
            background: linear-gradient(135deg, #e94560, #c0392b);
            color: white;
            box-shadow: 0 4px 15px rgba(233, 69, 96, 0.4);
        }

        #btnGenerer:hover {
            background: linear-gradient(135deg, #ff6b6b, #e94560);
            box-shadow: 0 6px 20px rgba(233, 69, 96, 0.6);
            transform: translateY(-2px);
        }

        #btnAfficher {
            background: linear-gradient(135deg, #0f3460, #533483);
            color: white;
            box-shadow: 0 4px 15px rgba(83, 52, 131, 0.4);
        }

        #btnAfficher:hover {
            background: linear-gradient(135deg, #533483, #7b2d8b);
            box-shadow: 0 6px 20px rgba(83, 52, 131, 0.6);
            transform: translateY(-2px);
        }

        #btnAfficher:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* --- TABLE --- */
        .table-box {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: none;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .table-box h2 {
            font-size: 1.1rem;
            margin-bottom: 15px;
            color: #a8dadc;
        }

        .table-liste {
            list-style: none;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .table-liste li {
            background: rgba(255, 255, 255, 0.07);
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 1rem;
            color: #fff;
            border-left: 3px solid #e94560;
            text-align: left;
            transition: background 0.2s;
        }

        .table-liste li:hover {
            background: rgba(233, 69, 96, 0.2);
        }

        .table-liste li span {
            color: #e94560;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🎲 Tables de Multiplication</h1>
    <p class="subtitle">Génère une table au hasard et entraîne-toi !</p>

    <!-- Phrase générée -->
    <div class="phrase-box vide" id="phraseBox">
        <p id="phraseText">Clique sur "Générer" pour commencer…</p>
    </div>

    <!-- Boutons -->
    <div class="boutons">
        <button id="btnGenerer" onclick="genererTable()">🎲 Générer</button>
        <button id="btnAfficher" onclick="afficherTable()" disabled>📋 Afficher la table</button>
    </div>

    <!-- Table affichée -->
    <div class="table-box" id="tableBox">
        <h2 id="tabletitre"></h2>
        <ul class="table-liste" id="tableListe"></ul>
    </div>
</div>

<script>
    let nombreActuel = null;

    // ----- Génère un nombre aléatoire et affiche la phrase -----
    function genererTable() {
        nombreActuel = Math.floor(Math.random() * 13); // 0 à 12

        // Mise à jour de la phrase
        const phraseBox  = document.getElementById('phraseBox');
        const phraseText = document.getElementById('phraseText');

        phraseText.textContent = `Récite la table de multiplication de ${nombreActuel}`;
        phraseBox.classList.remove('vide');

        // Activation du bouton "Afficher"
        document.getElementById('btnAfficher').disabled = false;

        // Masquer la table précédente
        const tableBox = document.getElementById('tableBox');
        tableBox.style.display = 'none';
    }

    // ----- Affiche la table complète -----
    function afficherTable() {
        if (nombreActuel === null) return;

        const tableBox   = document.getElementById('tableBox');
        const tabletitre = document.getElementById('tabletitre');
        const tableListe = document.getElementById('tableListe');

        tabletitre.textContent = `Table de ${nombreActuel}`;
        tableListe.innerHTML   = '';

        for (let i = 0; i <= 12; i++) {
            const resultat = nombreActuel * i;
            const li       = document.createElement('li');
            li.innerHTML   = `${nombreActuel} × ${i} = <span>${resultat}</span>`;
            tableListe.appendChild(li);
        }

        tableBox.style.display = 'block';
    }
</script>

</body>
</html>
